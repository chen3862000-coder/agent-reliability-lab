server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /agent/ {
    proxy_pass http://backend:8080/agent/;
    proxy_set_header Host $host;
  }
  location /providers {
    proxy_pass http://backend:8080/providers;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://backend:8080/health;
    proxy_set_header Host $host;
  }
  location /traces/ {
    proxy_pass http://backend:8080/traces/;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

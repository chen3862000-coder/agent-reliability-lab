server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /agent/ {
    proxy_pass http://backend:8080/agent/;
    proxy_set_header Host $host;
  }
  location /providers {
    proxy_pass http://backend:8080/providers;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://backend:8080/health;
    proxy_set_header Host $host;
  }
  location /traces/ {
    proxy_pass http://backend:8080/traces/;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

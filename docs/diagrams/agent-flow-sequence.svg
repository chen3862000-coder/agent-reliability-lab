<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .participant { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .core { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .future { fill: #fafafa; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; rx: 12; }
      .text { font: 400 15px Arial, sans-serif; fill: #111827; }
      .small { font: 400 12px Arial, sans-serif; fill: #374151; }
      .life { stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 6 6; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="60" y="58" class="title">Main Agent Flow Sequence</text>
  <text x="60" y="88" class="subtitle">Baseline read request with deterministic validation, observed tool results and bounded tracing.</text>

  <g id="participants">
    <rect x="55" y="125" width="145" height="62" class="participant"/>
    <text x="82" y="154" class="text">Client</text>
    <text x="78" y="174" class="small">curl / future UI</text>
    <rect x="245" y="125" width="180" height="62" class="participant"/>
    <text x="275" y="154" class="text">AgentController</text>
    <text x="282" y="174" class="small">arl-server</text>
    <rect x="470" y="125" width="220" height="62" class="core"/>
    <text x="500" y="154" class="text">AgentExecutionService</text>
    <text x="545" y="174" class="small">arl-core</text>
    <rect x="735" y="125" width="175" height="62" class="core"/>
    <text x="765" y="154" class="text">ProviderRegistry</text>
    <text x="775" y="174" class="small">ChatModel lookup</text>
    <rect x="955" y="125" width="165" height="62" class="core"/>
    <text x="990" y="154" class="text">ReactAgent</text>
    <text x="985" y="174" class="small">Alibaba graph</text>
    <rect x="1165" y="125" width="150" height="62" class="external"/>
    <text x="1195" y="154" class="text">LLM API</text>
    <text x="1190" y="174" class="small">DeepSeek/Grok</text>
    <rect x="1360" y="125" width="175" height="62" class="core"/>
    <text x="1384" y="154" class="text">Tool + Catalog</text>
    <text x="1388" y="174" class="small">contracts + fixtures</text>
  </g>

  <line x1="127" y1="187" x2="127" y2="1005" class="life"/>
  <line x1="335" y1="187" x2="335" y2="1005" class="life"/>
  <line x1="580" y1="187" x2="580" y2="1005" class="life"/>
  <line x1="822" y1="187" x2="822" y2="1005" class="life"/>
  <line x1="1037" y1="187" x2="1037" y2="1005" class="life"/>
  <line x1="1240" y1="187" x2="1240" y2="1005" class="life"/>
  <line x1="1448" y1="187" x2="1448" y2="1005" class="life"/>

  <path d="M127 230 L335 230" class="msg"/><text x="150" y="218" class="text">POST /agent/chat</text>
  <path d="M335 285 L580 285" class="msg"/><text x="370" y="273" class="text">validate DTO and call chat()</text>
  <path d="M580 340 L822 340" class="msg"/><text x="610" y="328" class="text">resolve selected provider</text>
  <path d="M822 382 L580 382" class="return"/><text x="635" y="374" class="small">ChatModel or explicit provider error</text>
  <path d="M580 435 L1037 435" class="msg"/><text x="610" y="423" class="text">create fresh ReactAgent + model-call hook</text>
  <path d="M1037 490 L1240 490" class="msg"/><text x="1060" y="478" class="text">model call with tool schemas</text>
  <path d="M1240 545 L1037 545" class="return"/><text x="1068" y="536" class="small">assistant tool proposal</text>
  <path d="M1037 600 L580 600" class="return"/><text x="690" y="590" class="small">proposed tool names observed</text>
  <path d="M580 655 L1448 655" class="msg"/><text x="620" y="643" class="text">execute registered callback with strict JSON arguments</text>
  <path d="M1448 710 L580 710" class="return"/><text x="845" y="700" class="small">ToolResult with data or sanitized errorCode</text>
  <path d="M580 765 L1037 765" class="msg"/><text x="610" y="753" class="text">continue graph with tool response</text>
  <path d="M1037 820 L1240 820" class="msg"/><text x="1075" y="808" class="text">final model call</text>
  <path d="M1240 875 L1037 875" class="return"/><text x="1068" y="866" class="small">assistant text ignored for business facts</text>
  <path d="M1037 925 L580 925" class="return"/><text x="720" y="916" class="small">graph completed</text>
  <path d="M580 965 L335 965" class="return"/><text x="382" y="956" class="small">AgentResponse + traceId</text>
  <path d="M335 1005 L127 1005" class="return"/><text x="155" y="996" class="small">HTTP status + JSON response</text>

  <rect x="70" y="770" width="355" height="75" class="note"/>
  <text x="90" y="798" class="text">Trace events captured throughout</text>
  <text x="90" y="822" class="small">AGENT_STARTED, MODEL_CALLED, TOOL_PROPOSED, TOOL_EXECUTED/FAILED, AGENT_COMPLETED</text>

  <rect x="1045" y="620" width="360" height="70" class="future"/>
  <text x="1065" y="648" class="text">M2 inserts protected write boundary here</text>
  <text x="1065" y="672" class="small">SafeToolExecutor, policy, confirmation, transaction, idempotency</text>
</svg>

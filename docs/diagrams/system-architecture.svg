<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .layer { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; rx: 18; }
      .layerTitle { font: 700 22px Arial, sans-serif; fill: #111827; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .core { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
      .future { fill: #fafafa; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .text { font: 400 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #374151; }
      .module { font: 700 13px Arial, sans-serif; fill: #1f2937; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="60" y="58" class="title">Agent Reliability Lab - High-Level Architecture</text>
  <text x="60" y="88" class="subtitle">LLMs propose actions; deterministic application layers validate, bound, trace and execute them.</text>

  <rect x="50" y="125" width="1300" height="120" class="layer"/>
  <text x="75" y="160" class="layerTitle">Interface Layer</text>
  <rect x="340" y="150" width="250" height="65" class="box"/>
  <text x="365" y="178" class="text">HTTP Client / Tests</text>
  <text x="365" y="200" class="small">curl, integration tests, future UI</text>
  <rect x="755" y="150" width="300" height="65" class="box"/>
  <text x="780" y="178" class="text">AgentController</text>
  <text x="780" y="200" class="small">/agent/chat, /health, /providers, /traces</text>
  <text x="765" y="230" class="module">arl-server</text>

  <rect x="50" y="285" width="1300" height="175" class="layer"/>
  <text x="75" y="320" class="layerTitle">Application Orchestration Layer</text>
  <rect x="160" y="345" width="260" height="80" class="core"/>
  <text x="185" y="375" class="text">AgentExecutionService</text>
  <text x="185" y="398" class="small">request isolation, limits, result mapping</text>
  <text x="185" y="418" class="module">arl-core</text>
  <rect x="570" y="345" width="240" height="80" class="core"/>
  <text x="595" y="375" class="text">ReactAgentFactory</text>
  <text x="595" y="398" class="small">fresh graph + model-call hook</text>
  <text x="595" y="418" class="module">arl-core</text>
  <rect x="960" y="345" width="240" height="80" class="core"/>
  <text x="985" y="375" class="text">TraceStore</text>
  <text x="985" y="398" class="small">bounded immutable snapshots</text>
  <text x="985" y="418" class="module">arl-core</text>

  <rect x="50" y="500" width="1300" height="175" class="layer"/>
  <text x="75" y="535" class="layerTitle">Agent, Provider and Tool Layer</text>
  <rect x="100" y="560" width="230" height="80" class="core"/>
  <text x="125" y="590" class="text">Alibaba ReactAgent</text>
  <text x="125" y="613" class="small">reasoning loop and tool selection</text>
  <rect x="405" y="560" width="250" height="80" class="core"/>
  <text x="430" y="590" class="text">ProviderRegistry</text>
  <text x="430" y="613" class="small">DeepSeek/Grok ChatModels, no fallback</text>
  <rect x="730" y="560" width="260" height="80" class="core"/>
  <text x="755" y="590" class="text">CommerceToolRegistry</text>
  <text x="755" y="613" class="small">contracts, JSON validation, callbacks</text>
  <rect x="1065" y="560" width="230" height="80" class="external"/>
  <text x="1090" y="590" class="text">LLM Providers</text>
  <text x="1090" y="613" class="small">DeepSeek / Grok APIs</text>

  <rect x="50" y="715" width="1300" height="165" class="layer"/>
  <text x="75" y="750" class="layerTitle">Domain and Reliability Boundary</text>
  <rect x="160" y="775" width="250" height="70" class="core"/>
  <text x="185" y="803" class="text">CommerceCatalog</text>
  <text x="185" y="825" class="small">immutable synthetic fixtures</text>
  <rect x="525" y="775" width="270" height="70" class="future"/>
  <text x="550" y="803" class="text">SafeToolExecutor + Policy</text>
  <text x="550" y="825" class="small">M2 exact-argument authorization</text>
  <rect x="910" y="775" width="260" height="70" class="future"/>
  <text x="935" y="803" class="text">SQLite + Idempotency</text>
  <text x="935" y="825" class="small">M2 durable write boundary</text>

  <path d="M590 182 L755 182" class="line"/>
  <path d="M905 215 L905 345" class="line"/>
  <path d="M755 385 L420 385" class="line"/>
  <path d="M420 385 L570 385" class="line"/>
  <path d="M810 385 L960 385" class="line"/>
  <path d="M690 425 L690 560" class="line"/>
  <path d="M530 560 L530 425" class="line"/>
  <path d="M655 600 L730 600" class="line"/>
  <path d="M990 600 L1065 600" class="line"/>
  <path d="M860 640 L410 775" class="line"/>
  <path d="M860 640 L660 775" class="softline"/>
  <path d="M795 810 L910 810" class="softline"/>

  <text x="60" y="925" class="small">Solid boxes are implemented in M1 unless labeled external. Dashed boxes/arrows show the intended M2 protected write boundary.</text>
</svg>

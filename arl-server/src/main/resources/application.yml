spring:
  application:
    name: agent-reliability-lab
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${ARL_SERVER_ADDRESS:127.0.0.1}
  port: ${ARL_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    # Upstream INFO logs can include prompts and model responses.
    com.alibaba.cloud.ai.graph: WARN

arl:
  db:
    path: ${ARL_DB_PATH:}
  llm:
    default-provider: ${ARL_DEFAULT_PROVIDER:deepseek}
    timeout-seconds: ${ARL_LLM_TIMEOUT_SECONDS:30}
    temperature: ${ARL_LLM_TEMPERATURE:}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
    grok:
      api-key: ${XAI_API_KEY:}
      model: ${GROK_MODEL:grok-4.7}
